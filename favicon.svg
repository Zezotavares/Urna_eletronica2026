<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="corpoUrna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="telaLcd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="btnVerde" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Carcaça externa da Urna -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#corpoUrna)" stroke="#38bdf8" stroke-width="3"/>

  <!-- Tela LCD com Visto de Voto -->
  <rect x="14" y="14" width="72" height="44" rx="8" fill="url(#telaLcd)" stroke="#94a3b8" stroke-width="2"/>
  <path d="M28 36 L42 50 L72 22" fill="none" stroke="#2563eb" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Teclado da Urna: Teclas Branca, Corrige e Grande Confirma -->
  <rect x="14" y="66" width="18" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="36" y="66" width="18" height="18" rx="4" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
  <rect x="58" y="64" width="28" height="22" rx="5" fill="url(#btnVerde)" stroke="#14532d" stroke-width="1.5"/>
</svg>
