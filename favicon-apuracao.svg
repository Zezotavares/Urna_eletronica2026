<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo Circular -->
  <circle cx="50" cy="50" r="45" fill="url(#bgDash)" stroke="#0ea5e9" stroke-width="3"/>

  <!-- Gauge / Círculo de Progresso da Apuração -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="150" stroke-dashoffset="40" stroke-linecap="round"/>

  <!-- Símbolo de Porcentagem Central -->
  <text x="50" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>
</svg>
